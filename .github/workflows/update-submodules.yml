name: Update Submodules

on:
  schedule:
    - cron: "0 18 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  update-submodules:
    runs-on: ubuntu-latest
    steps:
      # El job venía fallando a diario desde el 28/07 con
      # "could not read Username for 'https://github.com'": PAT_SYNC estaba
      # vacío o caducado y actions/checkout se quedaba sin credenciales en el
      # primer fetch, con un error que no decía cuál era la causa. Se comprueba
      # antes para que el fallo apunte al secreto.
      - name: Verificar que PAT_SYNC está configurado
        env:
          PAT_SYNC: ${{ secrets.PAT_SYNC }}
        run: |
          if [ -z "$PAT_SYNC" ]; then
            echo "::error::El secreto PAT_SYNC no está configurado o caducó."
            echo "Necesita un token con permiso 'repo' para leer los submódulos"
            echo "y abrir el pull request. Se renueva en Settings > Secrets and"
            echo "variables > Actions del repositorio."
            exit 1
          fi

      - name: Checkout main repo
        uses: actions/checkout@v5
        with:
          token: ${{ secrets.PAT_SYNC }}
          submodules: recursive
          fetch-depth: 0
          persist-credentials: true

      - name: Configurar git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Actualizar submódulos y detectar cambios
        id: check_changes
        run: |
          # Guardar el estado actual
          git diff --quiet && BEFORE_CLEAN=true || BEFORE_CLEAN=false
          
          # Actualizar submódulos
          git submodule update --remote --recursive
          
          # Verificar si hay cambios
          if git diff --quiet && git diff --cached --quiet; then
            echo "changes_detected=false" >> $GITHUB_OUTPUT
            echo "✓ No hay cambios en los submódulos"
          else
            echo "changes_detected=true" >> $GITHUB_OUTPUT
            git add .
            echo "✓ Se detectaron cambios en los submódulos"
            git diff --cached --stat
          fi

      - name: Set date
        if: steps.check_changes.outputs.changes_detected == 'true'
        run: echo "DATE=$(date +'%Y-%m-%d')" >> $GITHUB_ENV

      - name: Crear Pull Request automático
        if: steps.check_changes.outputs.changes_detected == 'true'
        uses: peter-evans/create-pull-request@v7
        with:
          token: ${{ secrets.PAT_SYNC }}
          branch: ci/update-submodules-${{ github.run_id }}
          base: main
          title: "chore: update submodule references (${{ env.DATE }})"
          body: |
            🤖 **Actualización automática de referencias de submódulos**

            - `apps/frontend` → Últimos cambios desde [`Tsplivalo/TGS-Frontend`](https://github.com/Tsplivalo/TGS-Frontend)
            - `apps/backend` → Últimos cambios desde [`lautaro-peralta/TGS-Backend`](https://github.com/lautaro-peralta/TGS-Backend)

            _Este pull request fue generado automáticamente por GitHub Actions._
          commit-message: "[create-pull-request] automated submodule update"
          committer: "github-actions[bot] <41898282+github-actions[bot]@users.noreply.github.com>"
          author: "lautaro-peralta <205333171+lautaro-peralta@users.noreply.github.com>"
          delete-branch: true
